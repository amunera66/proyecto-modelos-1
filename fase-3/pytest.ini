[pytest]
# Ejecutar desde fase-3/:  python -m pytest
testpaths = tests
filterwarnings =
    # starlette avisa al importar TestClient con httpx 0.28.1; funciona igual (ver docs/decisiones.md)
    ignore:Using .httpx. with .starlette\.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning
